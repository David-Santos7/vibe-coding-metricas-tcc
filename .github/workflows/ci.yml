name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run tests with native coverage
        run: npm run test:coverage 2>&1 | tee test-coverage.log
      - name: Upload test and coverage log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-coverage
          path: test-coverage.log
          if-no-files-found: warn
